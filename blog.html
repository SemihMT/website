  <script src="./assets/scripts/posts.js"></script>
  <script>
    // ─── Theme toggle ───
    const toggle = document.getElementById('themeToggle');
    const saved = localStorage.getItem('theme');
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    if (saved === 'light' || (!saved && !prefersDark)) {
      document.documentElement.setAttribute('data-theme', 'light');
    }
    toggle.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
      localStorage.setItem('theme', isLight ? 'dark' : 'light');
      syncHljsTheme();
    });

    // ─── Render posts from shared posts.js ───
    function renderPosts() {
      const list = document.getElementById('posts-list');
      const visible = BLOG_POSTS.filter(p => !p.draft);
      list.innerHTML = visible.map((post, i) => `
        <a href="${post.href}" class="post-row">
          <span class="post-num">${String(i + 1).padStart(2, '0')}</span>
          <span class="post-title-text">${post.title}</span>
          ${post.date ? `<span class="post-date">${post.date}</span>` : ''}
          <span class="post-desc">${post.desc}</span>
          <span class="post-arrow">→</span>
        </a>
      `).join('');
    }

    renderPosts();
  </script>
